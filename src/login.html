<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District 4 - Login</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script type="module" src="JS/login.ts"></script>
</head>
<body>
    <div class="login-container">
        <div class="flavor">
            <h2>Lock in!</h2>
            <small><i>The white void awaits.</i></small>
        </div>
        <div class="type-container">
            <button class="type" id="sign-in">Sign In</button>
            <button class="type" id="sign-up">Sign Up</button>
        </div>
        
        <div class="info-container">
            <span>Username</span>
            <div id="username" contenteditable="true"></div>
            <span>Password</span>
            <div id="password" contenteditable="true"></div>
            <button id="login-button">Log In</button>
        </div>
    </div>
</body>
</html>
