<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District 4 - Login</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script type="module" src="JS/login.ts"></script>
</head>
<body>
    <div class="login-container">
        <div class="type-container">
            <button class="type" id="sign-in-toggle">Sign In</button>
            <button class="type" id="sign-up-toggle">Sign Up</button>
        </div>

        <div class="sign-in" id="sign-in">
            <div class="flavor">
                <h2>Lock in!</h2>
                <small><i>The white void beckons.</i></small>
            </div>
            <form method="POST" action="/api/login" class="sign-in-info">
                <label for="username">Username</label><br>
                <input id="username" name="username" autocomplete="username" required>
                <br><br>
                <label for="password">Password</label><br>
                <input id="password" name="password" type="password" required>
                <br><br>
                <label for="remember">
                    <input id="remember" name="remember" type="checkbox"> 
                    Remember Login
                </label>
                <br>
                <button type="submit">Log In</button>
            </form>
        </div>

        <div class="sign-up" id="sign-up">
            <div class="flavor">
                <h2>New Here, are You?</h2>
                <small><i>Go on, tell us more.</i></small>
            </div>
            <form method="POST" action="/api/user" id="sign-up-info" class="sign-up-info">
                <label for="username">Username</label><br>
                <input id="username" name="username" required>
                <br><br>
                <label for="alias">Nickname</label><br>
                <input id="alias" name="alias" required>
                <br><br>
                <label for="email">Email Address</label><br>
                <input id="email" name="email" required>
                <br><br>
                <label for="pw-reg">Password</label><br>
                <input id="pw-reg" name="password" type="password" id="pw-reg" required>
                <br><br>
                <label for="pw-confirm">Confirm Password</label><br>
                <input id="pw-confirm" name="confirm" type="password" id="pw-confirm" required>
                <br>
                <button type="submit">Register</button>
            </div>
        </div>
        
    </div>
</body>
</html>
