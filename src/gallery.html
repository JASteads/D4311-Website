<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District 4 - Gallery</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script type="module" src="JS/gallery.ts"></script>
</head>
<body>
    <h1>Gallery</h1>
    <div class="gallery-container" id="gallery-container" style="margin: 10px 30px">
        <!-- Filter and upload stuff -->
        <label for="gallery-select" class="gallery-label" id="gallery-label">Filter by Category:</label>
        <select class="gallery-select" id="gallery-select">
            <option>None</option>
        </select>

        <!-- Gallery placeholders -->
        <div class="gallery-grid" id="gallery-grid">
            <div class="empty-gallery-message" id="empty-gallery-message">
                <h3>Nothing to see here!</h3>
                <p>Stay tuned for new art drops for this category.</p>
            </div>
        </div>
    </div>
</body>
