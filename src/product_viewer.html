<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District 4 - Product</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script type="module" src="JS/product-viewer.ts"></script>
</head>
<body>
    <div class="product-body">
        <h1 id="title"></h1>
        <small id="date"></small>
        <div>
            <section class="introduction" id="introduction"></section>
            <section class="details" id="details">
                <h2>Recent News</h2>
                <ul class="news" id="news"></ul>
            </section>
        </div>
    </div>

    <div class="product-download">
        <div class="inner">
            <h1>Download</h1>
            <section class="links">
                <a id="steam-link">Steam</a>
                <a id="paypal-link">PayPal</a>
                <a id="other-link">Other</a>
            </section>
        </div>
    </div>
</body>
</html>
