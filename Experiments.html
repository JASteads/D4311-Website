<!DOCTYPE html>

<html>
    <head>
        <title>District 4311</title>
        <link href="./style.css" type="text/css" rel="stylesheet">
    </head>
    <body>
        <header>
            <img src="./Images/LoL.png" alt="A Lemon">
            <h1>District 4311</h1>
        </header>

        <nav>
            <a href="./Home Page.html">Home</a>
        </nav>

        <main>
            <h1>Experiments</h1>
            <table>
                <thead>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                        <th>Column 3</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Data 1</td>
                        <td>Data 2</td>
                        <td>Data 3</td>
                    </tr>
                    <tr>
                        <td>Data 1a</td>
                        <td>Data 2a</td>
                        <td>Data 3a</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td>END</td>
                    </tr>
                </tfoot>
            </table>
            <br>
            <section style="margin-bottom: 300px;">
                <form action="Home Page.html" method="POST">
                    <span>Are you a furry?</span>
                    <label for="yes">Yes</label>
                    <input type="radio" id="yes" value="yes" name="ask fur">
                    <label for="no">No</label>
                    <input type="radio" id="no" value="no" name="ask fur">
                    <br><br>

                    <label for="furriness">How much of a furry are you?</label>
                    <br><br>

                    <span>Weeb</span>
                    <input type="range" id="furriness" name="furriness" min="0" max="5" step="1" value="2">
                    <span>OWO</span>
                    <br><br>

                    <label for="desc">Describe your furriness, if you will...</label>
                    <br>
                    <textarea id="desc" name="desc"></textarea>
                    <br>
                    <input type="submit" value="Right Then...">
                </form>
            </section>
        </main>

        <footer>
            <a href="./Home Page.html" id="logo"><img src="./Images/LoL.png" style="height: 50px;"></a>
            <p style="text-align: center; font-size: 12px;">The Intermission is Real.</p>
        </footer>
    </body>
</html>
